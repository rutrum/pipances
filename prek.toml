# Built-in hooks
[[repos]]
repo = "builtin"
hooks = [
  {
    id = "trailing-whitespace",
    args = ["--markdown-linebreak-ext=md"]
  },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml", exclude = "^rules/" },
]

# Local hooks via uv (project-managed tool versions)
[[repos]]
repo = "local"
hooks = [
  # --- ruff ---
  {
    id = "ruff-format",
    name = "ruff format",
    language = "system",
    entry = "uv run ruff format",
    types = ["python"]
  },
  {
    id = "ruff-check",
    name = "ruff check",
    language = "system",
    entry = "uv run ruff check --fix",
    types = ["python"]
  },

  # --- djlint (Jinja templates) ---
  {
    id = "djlint-reformat",
    name = "djlint reformat",
    language = "system",
    entry = "uv run djlint --reformat",
    files = "\\.jinja2$"
  },
  {
    id = "djlint-lint",
    name = "djlint lint",
    language = "system",
    entry = "uv run djlint --lint",
    files = "\\.jinja2$"
  },

  # --- tombi (TOML formatting) ---
  {
    id = "tombi-format",
    name = "tombi format",
    language = "system",
    entry = "uv run tombi format",
    files = "\\.toml$"
  },

  # --- ast-grep (structural search) ---
  {
    id = "ast-grep-scan",
    name = "ast-grep scan",
    language = "system",
    entry = "uv run ast-grep scan",
    pass_filenames = false
  },

  # --- ty (type checker) ---
  {
    id = "ty-check",
    name = "ty check",
    language = "system",
    entry = "uv run ty check src/ importers/ tests/ scripts/",
    pass_filenames = false
  },

  # --- pymarkdownlnt (Markdown linting) ---
  {
    id = "pymarkdownlnt",
    name = "pymarkdownlnt",
    language = "system",
    entry = "uv run pymarkdownlnt fix",
    files = '\.md$'
  },

  # --- typos (spell checker, from nix devshell) ---
  {
    id = "typos",
    name = "typos",
    language = "system",
    entry = "typos",
    pass_filenames = false
  },

  # --- nixfmt (Nix formatter, from nix devshell) ---
  {
    id = "nixfmt",
    name = "nixfmt",
    language = "system",
    entry = "nixfmt",
    files = '\.nix$'
  },
]
