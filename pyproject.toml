[project]
name = "pipances"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "rutrum", email = "dave@rutrum.net" }]
dependencies = [
  "aiosqlite>=0.22.1",
  "altair>=6.0.0",
  "fastapi>=0.135.1",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "pandas>=3.0.1",
  "patito>=0.8.6",
  "polars>=1.39.2",
  "pyarrow>=23.0.1",
  "pydantic-settings>=2.15.0",
  "python-multipart>=0.0.22",
  "scikit-learn>=1.8.0",
  "sqlalchemy[asyncio]>=2.0.48",
  "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
  "ast-grep-py>=0.45.1",
  "djlint>=1.36.4",
  "httpx2>=2.12.0",
  "playwright>=1.58.0",
  "pymarkdownlnt>=0.9.39",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-playwright>=0.7.2",
  "ruff>=0.15.7",
  "tombi>=1.4.1",
  "ty>=0.0.73",
  "vulture>=2.16",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 120
close_void_tags = true
ignore = "J018,J004,H030,H031,T028"
format_js = true
format_css = true

[tool.pymarkdown.extensions.front-matter]
enabled = true

[tool.pymarkdown.plugins.md013]
enabled = false

[tool.pymarkdown.plugins.md024]
siblings_only = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP",  # pyupgrade
  "B",  # bugbear
  "S",  # bandit (security)
]
ignore = [
  "E501",  # line too long — handled by formatter for code; string literals stay readable
  "E712",  # == True comparisons — required for SQLAlchemy column expressions
]

[tool.ruff.lint.per-file-ignores]
"importers/*" = ["S"]
"scripts/*" = ["S"]
"tests/*" = ["S"]

[tool.vulture]
paths = ["src", "scripts"]
min_confidence = 60
sort_by_size = true
ignore_decorators = [
  "@app.get",
  "@app.post",
  "@app.put",
  "@app.patch",
  "@app.delete",
  "@router.get",
  "@router.post",
  "@router.put",
  "@router.patch",
  "@router.delete",
  "@field_validator",
  "@model_validator",
  "@computed_field",
]
# Names that are used but unreachable statically. Vulture matches by bare name,
# so a false positive here is silenced everywhere -- fix the code when a
# finding turns out to be real.
#
# - connection_record: SQLAlchemy "connect" event callback arg
# - the rest: Pydantic fields populated via model_dump(), dict kwargs or
#   constructor keywords, which vulture cannot trace
ignore_names = [
  "connection_record",
  "ml_confidence",
  "can_approve",
  "external_account",
  "charts",
  "top",
  "dir",
  "type",
  "last_page",
  "last_row",
  "model_config",
  "variants",
  "approved_amounts",
]
